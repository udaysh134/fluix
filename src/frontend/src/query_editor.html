<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Query Card — Fluix</title>
  <link rel="stylesheet" href="./css/query_editor.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="name">Fluix</span></div>

      <nav class="nav">
        <a href="sign-in.html">Home</a>
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">About</a>
        <a href ="bot_selection.html"></a>
      </nav>

      
    </header>

    <main class="stage">
      <div class="panel">
        <form class="card" role="dialog" aria-labelledby="card-title">
          <h3 id="card-title">Query</h3>
          <input class="input" placeholder="Q1 ..." type="text" aria-label="Query">

          <h3>Tags</h3>
          <div class="tags">
            <button type="button" class="tag">tag 1</button>
            <button type="button" class="tag">tag 2</button>
            <button type="button" class="tag">tag 3</button>
          </div>

          <h3>Answer</h3>
          <textarea class="textarea" rows="4" placeholder="Write the answer here..."></textarea>

          <div class="actions">
            <button class="btn btn-primary" type="submit"><a href="bot_editor.html">Save</a></button>
            <button class="btn btn-ghost" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
