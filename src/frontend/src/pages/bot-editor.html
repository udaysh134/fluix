<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fluix — Bot Editor</title>
    <!-- Link Global Style -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Link Page Specific Style -->
    <link rel="stylesheet" href="../css/bot-editor.css" />
</head>

<body>
    <div class="container">
        <!-- Shared Navbar Structure -->
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">F</div>
                <span>Fluix</span>
            </div>
            <div class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="#">FEATURES</a>
                <a href="#">PRICING</a>
                <a href="#">ABOUT</a>
            </div>
            <div class="nav-actions">
                <a href="sign-in.html" class="login-link">LOGIN</a>
                <a href="sign-in.html" class="btn btn-primary">SIGN UP</a>
            </div>
        </nav>

        <div class="hero-card">
            <div class="grid">
                <!-- Left column: search + Q/A cards -->
                <section class="left-col">
                    <form class="search" role="search" onsubmit="return false;">
                        <input id="q" placeholder="Search a query" />
                    </form>

                    <div class="qna-list">
                        <article class="qna-card">
                            <div class="qna-grid">
                                <div class="label">Q:</div>
                                <div>How do I create a bot?</div>
                                <div class="label">A:</div>
                                <div>Click the + button on dashboard.</div>
                            </div>
                        </article>

                        <article class="qna-card">
                            <div class="qna-grid">
                                <div class="label">Q:</div>
                                <div>Can I export data?</div>
                                <div class="label">A:</div>
                                <div>Yes, use the export tool.</div>
                            </div>
                        </article>
                    </div>
                    <!-- Floating Plus Button (FAB) -->
                    <div class="floating-fab">
                        <a href="query-editor.html" class="fab-btn">+</a>
                    </div>
                </section>

                <!-- Center vertical toolbar -->
                <aside class="tool-col">
                    <button class="tool-btn" title="Filters">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                    </button>
                    <button class="tool-btn" title="Connections">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
                    </button>
                    <button class="tool-btn" title="Data">
                         <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </button>
                    <button class="tool-btn" title="Preview">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 5c-3.866 0-7 3.134-7 7s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7zm0 3c-2.209 0-4 1.791-4 4s1.791 4 4 4 4-1.791 4-4-1.791-4-4-4z"/></svg>
                    </button>
                    <button class="tool-btn" title="Voice">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>
                </aside>

                <!-- Right column: bot card and CTA -->
                <aside class="right-col">
                    <div class="bot-panel">
                        <div class="bot-head">
                            <div class="bot-icon-placeholder"></div>
                            <h2 class="bot-title">Bot Name</h2>
                        </div>

                        <div class="bot-body">
                            <p class="empty">No conversation selected</p>
                        </div>

                        <div class="bot-actions">
                            <button class="ask-btn">Ask anything</button>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>
</body>

</html>
