<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Query Card — Fluix</title>
    <!-- Link Global Style -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Link Page Specific Style -->
    <link rel="stylesheet" href="../css/query-editor.css">
</head>

<body>
    <div class="container">
        <!-- Shared Navbar Structure -->
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">F</div>
                <span>Fluix</span>
            </div>
            <div class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="#">FEATURES</a>
                <a href="#">PRICING</a>
                <a href="#">ABOUT</a>
            </div>
            <div class="nav-actions">
                <a href="sign-in.html" class="login-link">LOGIN</a>
                <a href="sign-in.html" class="btn btn-primary">SIGN UP</a>
            </div>
        </nav>

        <main class="stage">
            <div class="panel">
                <form class="card" role="dialog" aria-labelledby="card-title" onsubmit="return false;">
                    <h3 id="card-title">Query</h3>
                    <input class="input" placeholder="Q1 ..." type="text" aria-label="Query">

                    <h3>Tags</h3>
                    <div class="tags">
                        <button type="button" class="tag">tag 1</button>
                        <button type="button" class="tag">tag 2</button>
                        <button type="button" class="tag">tag 3</button>
                    </div>

                    <h3>Answer</h3>
                    <textarea class="textarea" rows="4" placeholder="Write the answer here..."></textarea>

                    <div class="actions">
                        <a href="bot-editor.html" class="btn btn-primary">Save</a>
                        <button class="btn btn-ghost" type="button">Cancel</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
