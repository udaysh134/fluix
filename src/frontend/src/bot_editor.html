<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/editor.css" />
    <title>Fluix — Bot Editor</title>
  </head>
  <body>
  
        <div class="container">
    <header class="topbar">
      <div class="left">
          <span class="brand-name">Fluix</span>
        </div>

        <nav class="nav">
          <a href="sign-in.html " target="_blank">Home</a>
          <a href="#">Features</a>
          <a href="#">Pricing</a>
          <a href="#">About</a>
          <a href="bot_selection.html " target="_blank">My Project</a>
        </nav>
          <div class="user"></div>
        </div>
      </div>
    </header>
     <div class="hero-card">
        <div class="grid">
          <!-- Left column: search + Q/A cards -->
          <section class="left-col">
            <form class="search" role="search" onsubmit="return false;">
              
              <input id="q" placeholder="Search a query" />
            </form>

            <div class="qna-list">
              <article class="qna-card">
                <div class="qna-grid">
                  <div class="label">Q:</div>
                  <br>
                  <div class="label">A:</div>
                </div>
              </article>

              <article class="qna-card">
                <div class="qna-grid">
                  <div class="label">Q:</div>
                 <br>
                  <div class="label">A:</div>
                </div>
              </article>

              <article class="qna-card">
                <div class="qna-grid">
                  <div class="label">Q:</div>
                   <br>
                  <div class="label">A:</div>
                  </div>
              </article>
            </div>
          </section>

          <!-- Center vertical toolbar -->
          <aside class="tool-col">
            <button class="tool-btn" title="Filters">
              
            <button class="tool-btn" title="Sort">
              
            </button>
            <button class="tool-btn" title= " Add Q/A">
              
            </button>
            <button class="tool-btn" title="Preview">
              
            </button>
            <button class="tool-btn" title="Voice">
              
            </button>
          </aside>

          <!-- Right column: bot card and CTA -->
          <aside class="right-col">
            <div class="bot-panel">
              <div class="bot-head">
                <h2 class="bot-title">Bot Name</h2>
              </div>

              <div class="bot-body">
                <p class="empty">No conversation selected </p>
              </div>

              <div class="bot-actions">
                <button class="ask-btn">Ask anything </button>
              </div>
            </div>
          </aside>
        </div>

        
      </div>
    </div>

    
  </body>
</html>
