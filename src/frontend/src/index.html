<!DOCTYPE html>

<html lang="en">
	<head>
    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">

    	<link rel="stylesheet" href="./css/style.css">
		<link rel="icon" href="../assets/images/Fuix Logo.png" type="image/png">

    	<title>Fluix - AI chatbot builder</title>
	</head>

	<body>
		<img src="../assets/images/Fuix Logo.png" alt="Fluix Logo" class="logo">

    	<h1>FLUIX</h1>
    	<p>Build Once, Chat Forever</p>

    	<form class="signin-form" action="/login" method="post">
    		<h2>Sign In</h2>
			
    		<label for="username">Username</label>
    		<input type="text" id="username" name="username" required>

    		<label for="password">Password</label>
    		<input type="password" id="password" name="password" required>

    		<button type="submit">Sign In</button>
			<label for="signup">Do not have an account?</label>
    	</form>
	</body>
</html>
